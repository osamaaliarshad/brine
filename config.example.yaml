# brine configuration. Copy to config.yaml and adjust.
#
# Secrets never go in this file directly: use ${VAR} placeholders, or override any key
# with an environment variable named BRINE__<SECTION>__<KEY> (e.g. BRINE__SALT_API__PASSWORD).

salt_api:
  url: https://salt.internal:8000
  username: brine-service          # dedicated, least-privilege eauth user
  password: ${SALT_API_PASSWORD}
  eauth: pam
  verify_tls: true

# How browsers reach brine. The sign-in redirect is <public_url>/api/auth/callback.
public_url: https://brine.example.com

# Sign-in with your own OIDC provider; docs/oidc-providers.md has Google, Okta, Entra, Keycloak.
# Register a client of your own: no client ID or secret ships with brine.
auth:
  provider: oidc                   # or none: no sign-in, everyone gets anonymous_role (demo only)
  issuer: https://accounts.google.com
  client_id: ${OIDC_CLIENT_ID}
  client_secret: ${OIDC_CLIENT_SECRET}
  allowed_domains: [example.com]   # optional: refuse every other email domain
  session_hours: 12

roles:                             # fnmatch-style email patterns; highest match wins
  viewer:   ["*@example.com"]      # no match, no access
  operator: ["alice@example.com"]
  admin:    ["bob@example.com"]    # admins see the audit log

commands:                          # what each role may run from the Run page (fnmatch)
  operator: ["test.*", "state.apply", "service.restart", "runners.manage.*"]
  admin: ["*"]                     # the default: anything brine's Salt account may run
                                   # viewers never run commands
  catch_up_days: 7                 # how long a catch-up run waits for an offline minion

templates:                         # one-click commands on the Run page (SaltGUI's
  restart-web:                     # saltgui_templates in the master config work too)
    description: Restart the web servers
    target: "G@role:web"
    target_type: compound
    command: service.restart nginx
    category: Web
  deploy-branch:                   # {{ name }} becomes a field to fill in on the Run page
    description: Deploy a branch to one machine
    target: "{{ minion }}"
    target_type: list
    command: 'state.apply app.deploy pillar=''{"branch": "{{ branch }}"}'''
    category: Deploy

fleet:
  columns:                         # custom grains shown in the fleet table
    - grain: app_version
      label: App version
    - grain: firmware_version
      label: Firmware
  stale_after_minutes: 15

retention:                         # days of history brine keeps (0 = forever)
  jobs_days: 90
  history_days: 90                 # presence changes and grains history
  audit_days: 365

database: sqlite:///data/brine.db  # or postgresql://user:pass@host/brine
