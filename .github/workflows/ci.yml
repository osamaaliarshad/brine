name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tag upstream
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Integration: bring up the demo Salt fleet and prove salt-api gives brine what it needs,
  # including a minion going offline and coming back.
  demo-stack:
    name: demo stack (Salt ${{ matrix.salt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        salt: ["3006", "3007", "3008"]  # every release Salt supports: docs/salt-versions.md
    env:
      SALT_VERSION: ${{ matrix.salt }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tag upstream
      - run: docker compose -f docker-compose.demo.yml up -d --build --wait
      - run: uv run --project backend python demo/smoke_test.py --presence
      - name: backend end-to-end (presence, jobs, master and backend restarts)
        working-directory: backend
        env:
          BRINE_DEMO_SALT_API: http://127.0.0.1:8001
        run: uv run pytest tests/test_demo_integration.py -v
      - if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color --tail 100
