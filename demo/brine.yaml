# brine config for the demo Salt fleet (docker-compose.demo.yml). Demo credentials only.
#
#   cd backend
#   BRINE_CONFIG=../demo/brine.yaml uv run uvicorn app.main:create_app --factory --reload

salt_api:
  url: ${SALT_API_URL:-http://127.0.0.1:8001}
  username: brine
  password: ${SALT_API_PASSWORD:-brine-demo}
  eauth: pam

fleet:
  columns:
    - grain: site
      label: Site
    - grain: app_version
      label: App version
    - grain: firmware_version
      label: Firmware
  stale_after_minutes: 15

presence:
  method: auto

# The demo runs without sign-in: every visitor is treated as an admin, and brine shows a
# banner saying so. Real deployments use OIDC (see config.example.yaml).
auth:
  provider: none
  anonymous_role: admin

# Command box. Admins (everyone here) may run anything the Salt account allows; with sign-in on,
# operators could run just these.
commands:
  operator: ["test.*", "state.apply", "grains.item", "saltutil.refresh_*", "runners.manage.*"]

database: ${BRINE_DATABASE:-sqlite:///data/brine-demo.db}
