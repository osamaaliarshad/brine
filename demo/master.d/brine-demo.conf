# Demo-only master settings. Don't copy these to a real master as-is: salt-api runs without TLS
# here because it is only reachable from the demo network and from the host's localhost.

# Fire salt/presence/* events so brine can show who is online right now. The default
# loop_interval is 60s; 15s makes the demo feel live.
presence_events: True
loop_interval: 15

# Short job cache, so it's easy to see brine keeping job history longer than the master does.
keep_jobs_seconds: 3600

# Accept the demo fleet automatically; any other minion (rover-04) stays pending in Keys.
autosign_file: /etc/salt/autosign.conf

# The states, and the rover-agent packages built into the image (salt://debs/, for agent.sls).
file_roots:
  base:
    - /srv/salt
    - /srv/debs

# One reactor, so brine's Reactors view has something to show.
reactor:
  - 'salt/minion/*/start':
    - /srv/reactor/minion-start.sls

# A few nodegroups, for brine's Nodegroups view.
nodegroups:
  rovers: 'G@role:rover'
  site-a: 'G@site:site-a'
  docks: 'L@dock-01'

netapi_enable_clients:
  - local
  - local_async
  - runner
  - wheel

rest_cherrypy:
  host: 0.0.0.0
  port: 8000
  disable_ssl: True

# Salt checks PAM passwords in a separate Python process, /usr/bin/python3 by default. The slim
# image has no system Python, so use the one bundled with the Salt packages.
auth.pam.python: /opt/saltstack/salt/bin/python3

# brine's service account: read-only, plus key management and a command box for the demo. Each
# write brine offers needs its function listed here AND a person brine allows to confirm it.
external_auth:
  pam:
    brine:
      - '*':
        - test.ping
        - test.version
        - grains.items
        - pillar.obfuscate
        - beacons.list
        - schedule.list
        - mine.valid
        - saltutil.running
        - state.show_top
        # Packages and checks: brine's own reads, as its Settings page writes them out for
        # demo/brine.yaml. Salt pins a check's command but not its other options, so in practice
        # an account with checks can run commands.
        - pkg.list_pkgs
        - cmd.run_all:
            args:
              - '^/opt/rover/bin/rover\-cli\ \-\-version\ 2>/dev/null\ \|\|\ true$'
      - '@runner':
        - jobs.active
        - jobs.list_job
        - jobs.list_jobs
        - jobs.lookup_jid
        - manage.alived
        - manage.status
        - manage.versions
        - cache.grains
      - '@wheel':
        - config.values
        - key.finger
        - key.list_all
        - minions.connected
        - file_roots.list_env
        - file_roots.read
        # Key management (Keys page: accept / reject / delete). Leave these out for a
        # read-only brine; it hides the buttons and says what's missing.
        - key.accept_dict
        - key.reject_dict
        - key.delete_dict
      - '@jobs'
      # Command box: what brine's account may run at all. brine's own allowlist (commands: in
      # brine's config) decides which people may run which of these.
      - '*':
        - test.*
        - state.*
        - grains.*
        - cmd.run
        - service.*
        - pkg.*
        - saltutil.*
        - sys.doc
      - '@runner':
        - manage.*
        - jobs.*
        - state.orchestrate
        - state.orchestrate_show_sls

# Command templates, in SaltGUI's format (brine reads them too): one click fills in the Run page.
saltgui_templates:
  ping-rovers:
    description: Is every rover answering?
    targettype: glob
    target: rover-*
    command: test.ping
    category: Health
  versions:
    description: Salt versions across the fleet
    command: runners.manage.versions
    category: Health
  motd-dry-run:
    description: What would the message-of-the-day state change?
    targettype: glob
    target: "*"
    command: state.apply motd test=True
    category: States
  refresh-grains:
    description: Have every minion re-read its grains
    targettype: glob
    target: "*"
    command: saltutil.refresh_grains
    categories: [Maintenance, Health]
